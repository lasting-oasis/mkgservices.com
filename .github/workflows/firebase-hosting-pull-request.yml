# Builds a temporary preview URL for each pull request and posts it as a
# comment, so changes can be checked before they reach main.
name: Preview on pull request

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Same pin as firebase-hosting-merge.yml; see the note there.
          firebaseToolsVersion: "15.34.0"
