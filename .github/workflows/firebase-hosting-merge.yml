# Deploys the site to Firebase Hosting every time main changes.
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT (the JSON key from
# Firebase > Project settings > Service accounts > Generate new private key).
# The Firebase project ID comes from .firebaserc.
# Until the secret exists, the run finishes early with a note instead of failing.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the Firebase secret is set
        id: check
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set yet. Add it under Settings > Secrets and variables > Actions, then push again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          # Keep the job's token out of .git/config. The site is deployed
          # from this checkout, and firebase.json ignores dot-folders.
          persist-credentials: false
      # The database rules go first, so the pages never run against rules
      # older than themselves; if this step fails, the pages are not
      # deployed either. firebase.json names the rules file; the project
      # comes from .firebaserc. If this step ever fails with a permission
      # error, give the service account the "Firebase Rules Admin" role in
      # Google Cloud > IAM. firebase-tools 13 is used here because 15.x
      # first checks that the Firestore API is enabled, which needs the
      # Service Usage permission this key may not have (see the pin below).
      # A failure's error lines are also posted as annotations, so they show
      # on the run's summary page without opening the log.
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Deploy Firestore rules
        if: steps.check.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-sa.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          log="$RUNNER_TEMP/rules-deploy.log"
          if npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --non-interactive >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            { grep -iE "error|denied|permission|missing|invalid|failed" "$log" || true; } | tail -n 8 | sed 's/%/%25/g' |
              while IFS= read -r line; do echo "::error title=Firestore rules deploy::$line"; done
            exit "$status"
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.check.outputs.ready == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          # Pinned to the version that last deployed (Oct 18, 2026). The first
          # deploy with 15.34.1, which checks that the Hosting API is enabled
          # before deploying, failed on Oct 27. Before moving to a newer version,
          # give the deploy service account the Service Usage Consumer role.
          firebaseToolsVersion: "15.34.0"
